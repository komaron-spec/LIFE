name: LifeSystem
options:
  bundleIdPrefix: com.komaron
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  LifeSystem:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.komaron.lifesystem
        INFOPLIST_FILE: Sources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/LifeSystem.entitlements
    entitlements:
      path: Sources/LifeSystem.entitlements
      properties:
        com.apple.developer.healthkit: true
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: LIFE SYSTEM
        NSHealthShareUsageDescription: "LIFE SYSTEMは、歩数・睡眠・運動の記録をPLAYERの状態として表示するためにヘルスケアデータを読み取ります。データはこのiPhone内で処理されます。"
        NSLocationWhenInUseUsageDescription: "LIFE SYSTEMは、現在地をWORLD STATEとして表示するために位置情報を使用します。"
        UIApplicationSupportsIndirectInputEvents: true
